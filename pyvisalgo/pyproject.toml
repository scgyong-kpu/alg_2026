[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvisalgo"
version = "0.1.0"
description = "Algorithm visualization helpers for the algorithm class"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyvisalgo*"]

[tool.setuptools.package-data]
pyvisalgo = ["assets/*.png"]
